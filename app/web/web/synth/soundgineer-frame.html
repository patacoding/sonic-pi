<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- Their stylesheet, unscoped, in its own document: it cannot reach Sonic Pi's page, and -- the reason this must be
       a frame rather than a div -- 100vh/100vw inside it mean THIS frame's box, which the parent fixes at their design
       size. Sizing a div that way is impossible, and their layout is written in vh. -->
  <link rel="stylesheet" href="./vendor/soundgineer-ui.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { buildApp } from "./vendor/soundgineer-ui.js";
    window.__mount = (engine) => {
      const app = document.getElementById("app");
      app.textContent = "";
      buildApp(engine, app);
      return app.children.length;
    };
    window.__kids = () => document.getElementById("app").children.length;
    window.__diag = () => ({ inner: [innerWidth, innerHeight], kids: window.__kids() });
  </script>
</body>
</html>
