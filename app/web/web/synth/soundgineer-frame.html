<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="./vendor/soundgineer-ui.css" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; }
    #app { min-height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    // Namespace import, deliberately: a named import of something an older engine build does not export fails at link
    // time and takes the whole frame with it. Through the namespace, a missing hook is just a missing property.
    import * as ui from "./vendor/soundgineer-ui.js";
    const { buildApp } = ui;

    // Our mined built-in voices, grouped by category in the preset menu. Registered HERE, before anything mounts, and
    // awaited at the top level so the menu's first render already has them; every step is guarded, because a missing file
    // or an engine without the hook must leave this frame exactly as it was.
    try {
      if (typeof ui.registerFactoryPresets !== "function") {
        console.info("Synth — this engine build has no preset registration hook; built-in voices are not offered");
      } else {
        const res = await fetch("./builtin-voices.json", { cache: "no-store" });
        if (!res.ok) console.info(`Synth — no built-in voices file beside this frame (HTTP ${res.status})`);
        else {
          const data = await res.json();
          const voices = (Array.isArray(data) ? data : data.voices) ?? [];
          const total = ui.registerFactoryPresets(voices.map((v) => ({ ...v, version: 1, fxOrder: v.fxOrder ?? [] })));
          console.info(`Synth — ${voices.length} built-in voice(s) registered (${total} factory presets in the menu)`);
        }
      }
    } catch (e) { console.warn("Synth — built-in voices could not be registered: " + (e?.message ?? e)); }

    // ONE view, built once, against this proxy. Its whole job is to guarantee that the UI is mapped to the SELECTED
    // channel's preset data -- for reading and for writing -- without anything ever being created or destroyed:
    // rebuilding their app per switch left their module-level knob registry holding dead canvases and leaked a WebGL
    // context every time, until Chrome evicted the oldest one (the Shadertoy preview) and it went black.
    console.info("Synth build: frame.html b100a4");   // which frame build this document is actually running
    let current = null;
    let builds = 0;               // how many times their app was actually built: it must stay 1
    const subs = new Map();      // param index -> { fn, off }
    const notes = new Set();     // their onNote callbacks, so the keyboard follows the channel too

    const view = new Proxy({}, {
      get(_t, key) {
        if (key === "onParam") return (index, fn) => {
          subs.set(index, { fn, off: current?.onParam?.(index, fn) });
          return () => { try { subs.get(index)?.off?.(); } catch { /* already off */ } subs.delete(index); };
        };
        if (key === "onNote") return (fn) => { notes.add(fn); return () => notes.delete(fn); };
        const v = current?.[key];
        return typeof v === "function" ? v.bind(current) : v;
      },
      set(_t, key, value) { if (current) current[key] = value; return true; },
      has(_t, key) { return current ? key in current : false; },
    });

    // THE SWITCH: the only place that decides which engine the view is looking at. Synchronous on purpose -- nothing
    // may be awaited between unbinding the old engine and binding the new one.
    window.__focus = (engine) => {
      if (!engine || engine === current) return false;
      for (const [index, sub] of subs) { try { sub.off?.(); } catch { /* already off */ } sub.off = engine.onParam?.(index, sub.fn); }
      current = engine;
      for (const [index, sub] of subs) { try { sub.fn(engine.getParam?.(index)); } catch { /* a knob mid-teardown */ } }
      return true;
    };

    window.__builds = () => builds;
    // which engine the single view in THIS document is looking at -- the diagnostic that was lost in a revert
    window.__view = () => current;
    window.__mount = (engine) => {
      if (current) return window.__focus(engine), document.getElementById("app").children.length;
      current = engine;
      builds++;
      const app = document.getElementById("app");
      app.textContent = "";
      buildApp(view, app);
      return app.children.length;
    };
    window.__kids = () => document.getElementById("app").children.length;
  </script>
</body>
</html>
