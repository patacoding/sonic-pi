<!doctype html>
<!--
  The output tab: the shader, and nothing else.

  Open it from the app (panel → "Output window", or sonicPiGfx.openOutput()) or by visiting this page
  directly in a second tab. It draws the SAME document as the main tab, with the same renderer, and takes
  the three things that make the picture what it is from the main tab over a BroadcastChannel:

    doc      the code and the channels (and the pictures they name, as data URLs)
    frame    the audio texture, the music's uniforms, the pointer, and the main tab's own clock
    (bye)    so the main tab stops broadcasting when this tab is closed

  Why a second copy of the rendering rather than moving the canvas: two tabs cannot share a GL context, so
  the choice is "the same code, drawn twice" (this) or "one context, moved" (documentPictureInPicture,
  Chrome-only and not a tab). Same code means the picture here is the picture there -- the shader runs on
  this tab's own GPU surface, at THIS window's resolution, which is what a projector wants.

  No interface, no controls: everything is controlled from the main tab. `F` or a click goes fullscreen.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sonic Pi · shader output</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #gfx-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #out-note {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: 13px/1.6 ui-monospace, monospace; color: #888; text-align: center; white-space: pre-line;
    transition: opacity .4s ease; pointer-events: none;
  }
  #out-note.gone { opacity: 0; }
  /* the reason it is blank, if it is: a shader that did not compile is worth saying out loud */
  #gfx-hud {
    position: fixed; left: 10px; top: 10px; z-index: 6;
    font: 11px/1.45 ui-monospace, monospace; color: #ddd;
    background: rgba(10, 12, 18, .55); border: 1px solid rgba(120, 130, 150, .35);
    border-radius: 4px; padding: 3px 7px; pointer-events: none; white-space: nowrap;
    opacity: 0; transition: opacity .15s ease;
  }
  #gfx-hud.on { opacity: .92; }
  #out-problem {
    position: fixed; left: 12px; bottom: 12px; max-width: 70vw;
    font: 11px/1.5 ui-monospace, monospace; color: #c66; white-space: pre-wrap; opacity: .9;
  }
</style>
</head>
<body>
<div id="out-note">waiting for the main tab…
(open the app and choose “Output window”, or press F for fullscreen here)</div>
<div id="out-problem"></div>
<script type="module" src="./gfx-out.js"></script>
</body>
</html>
